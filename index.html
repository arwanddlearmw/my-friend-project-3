<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Spec Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
    <header class="header">
        <div>
            <h1>Gemini Spec Analyzer</h1>
            <p>Analyze your device performance with Gemini AI</p>
        </div>

        <select id="language">
            <option value="en">English</option>
            <option value="ar">العربية</option>
        </select>
    </header>

    <section class="card">
        <h2>Device Type</h2>
        <div class="device-selector">
            <button class="device-button active" data-device="pc">💻 PC / Laptop</button>
            <button class="device-button" data-device="phone">📱 Phone</button>
        </div>
    </section>

    <section class="card">
        <h2>Device Specifications</h2>

        <div id="pcSpecs" class="specs-grid">
            <label>CPU<input id="cpu" type="text" placeholder="Intel Core i5-12400"></label>
            <label>GPU<input id="gpu" type="text" placeholder="NVIDIA RTX 3060"></label>
            <label>RAM<input id="ram" type="text" placeholder="16 GB"></label>
            <label>Storage<input id="storage" type="text" placeholder="1 TB NVMe SSD"></label>
            <label>PSU / Battery<input id="psuOrBattery" type="text" placeholder="550W"></label>
        </div>

        <div id="phoneSpecs" class="specs-grid hidden">
            <label>Screen<input id="phoneScreen" type="text" placeholder="6.7 inch AMOLED 120Hz"></label>
            <label>CPU<input id="phoneCpu" type="text" placeholder="Snapdragon 8 Gen 3"></label>
            <label>RAM<input id="phoneRam" type="text" placeholder="12 GB"></label>
            <label>Storage<input id="phoneStorage" type="text" placeholder="256 GB"></label>
            <label>Camera<input id="phoneCameras" type="text" placeholder="50MP + 12MP + 10MP"></label>
            <label>Battery<input id="phoneBattery" type="text" placeholder="5000 mAh"></label>
        </div>
    </section>

    <section class="card">
        <h2>Ask Gemini</h2>
        <label class="question-label" for="question">Your Question</label>
        <textarea id="question" rows="5" placeholder="Can this PC run Cyberpunk 2077?"></textarea>
        <button id="askButton" class="ask-button">Ask Gemini</button>
    </section>

    <!-- Every new analysis is appended here. Old analyses are never removed. -->
    <section class="results-section">
        <div class="results-header">
            <h2>Analysis History</h2>
            <button id="clearResults" class="clear-button" type="button">Clear</button>
        </div>
        <div id="results"></div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
